name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: yarn install --frozen-lockfile

      - name: Build excalidraw-app
        working-directory: excalidraw-app
        env:
          VITE_APP_BASE_PATH: /draw/
          VITE_APP_DISABLE_SENTRY: "true"
          VITE_APP_WS_SERVER_URL: ${{ vars.VITE_APP_WS_SERVER_URL }}
          VITE_APP_FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: excalidraw-app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
